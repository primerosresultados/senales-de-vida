<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05071a">
<title>Señales de vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --page: #05071a;
    --stage: #0a0e24;
    --ink: #f4f6ff;
    --accent: #ffcf3f;
    --track: rgba(255, 255, 255, .22);
    --glass: rgba(8, 11, 30, .62);
    --line: rgba(255, 255, 255, .14);
    --radius-stage: 22px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--page); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 9 / 16));
    width: min(100vw, calc(100dvh * 9 / 16));
    aspect-ratio: 9 / 16;
    background: var(--stage);
    overflow: hidden;
    touch-action: manipulation;
  }
  @media (min-width: 640px) and (min-height: 560px) {
    #stage {
      width: min(100vw, calc((100vh - 48px) * 9 / 16));
      width: min(100vw, calc((100dvh - 48px) * 9 / 16));
      border-radius: var(--radius-stage);
      box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .06);
    }
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }

  .bar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 5px; padding: 6px 12px 0; }
  .seg {
    flex: var(--w) 1 0; min-width: 0; height: 26px; padding: 8px 0 0; margin: 0;
    border: 0; background: none; cursor: pointer; display: block;
  }
  .seg .track { display: block; width: 100%; height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .seg .fill { display: block; width: 100%; height: 100%; border-radius: 999px; background: var(--ink); transform-origin: left center; transform: scaleX(0); }
  .seg:hover .track { background: rgba(255, 255, 255, .34); }

  .ctrls { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; }
  .btn {
    flex: 0 0 44px; width: 44px; height: 44px; padding: 0; margin: 0; border: 0; border-radius: 14px;
    background: var(--glass); color: var(--ink); display: grid; place-items: center; cursor: pointer;
    box-shadow: inset 0 0 0 1px var(--line);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    transition: background-color .18s ease, transform .18s ease;
  }
  .btn:hover { background: rgba(26, 32, 74, .78); }
  .btn:active { transform: scale(.94); }
  .btn svg { width: 20px; height: 20px; display: block; }
  .big-play {
    position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px;
    border: 0; border-radius: 24px; background: var(--glass); color: var(--ink);
    display: grid; place-items: center; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .big-play svg { width: 34px; height: 34px; display: block; margin-left: 4px; }
  .big-play[hidden] { display: none; }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main id="stage" aria-label="Animación: Señales de vida">
  <canvas id="c" aria-hidden="true"></canvas>

  <nav class="bar" aria-label="Escenas">
    <button class="seg" style="--w:4" aria-label="Ir a la escena 1: el gancho"><span class="track"><span class="fill"></span></span></button>
    <button class="seg" style="--w:8" aria-label="Ir a la escena 2: la web descuidada"><span class="track"><span class="fill"></span></span></button>
    <button class="seg" style="--w:7" aria-label="Ir a la escena 3: la web mantenida"><span class="track"><span class="fill"></span></span></button>
    <button class="seg" style="--w:7" aria-label="Ir a la escena 4: el cierre"><span class="track"><span class="fill"></span></span></button>
    <button class="seg" style="--w:4" aria-label="Ir a la escena 5: planes"><span class="track"><span class="fill"></span></span></button>
  </nav>

  <button class="big-play" id="bigPlay" aria-label="Reproducir" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.8v14.4a1.2 1.2 0 0 0 1.8 1l11.3-7.2a1.2 1.2 0 0 0 0-2L8.8 3.8A1.2 1.2 0 0 0 7 4.8z"/></svg>
  </button>

  <div class="ctrls">
    <button class="btn" id="restart" aria-label="Reiniciar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.8h3.8"/></svg>
    </button>
    <button class="btn" id="play" aria-label="Pausar">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="i-play" style="display:none"><path fill="currentColor" d="M7 4.8v14.4a1.2 1.2 0 0 0 1.8 1l11.3-7.2a1.2 1.2 0 0 0 0-2L8.8 3.8A1.2 1.2 0 0 0 7 4.8z"/></svg>
    </button>
  </div>
</main>

<script>
(() => {
'use strict';

/* =====================================================================
   Señales de vida — pieza de 30 s en loop, todo dibujado en Canvas.
   Mundo lógico de 360 x 640 unidades; la cámara hace zoom y paneos.
   Todo el estado se calcula a partir del tiempo t (se puede saltar).
   ===================================================================== */

const W = 360, H = 640, DUR = 30;
const SCENES = [[0, 4], [4, 12], [12, 19], [19, 26], [26, 30]];
const G = 560;          // línea de suelo del mundo
const P = 6;            // tamaño de pixel del personaje
const BGC = '#0c1130';

const stage = document.getElementById('stage');
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha: false });
let S = 1;

/* ---------- utilidades ---------- */
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const eo = u => 1 - Math.pow(1 - u, 3);
const eob = u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const pick = (list, t) => { let v = list[0][1]; for (const k of list) { if (t >= k[0]) v = k[1]; else break; } return v; };
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function kf(t, K, ease = eio) {
  const n = K.length;
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 0; i < n - 1; i++) {
    const a = K[i], b = K[i + 1];
    if (t < b[0]) {
      const u = ease((t - a[0]) / ((b[0] - a[0]) || 1));
      const out = [];
      for (let j = 1; j < a.length; j++) out.push(a[j] + (b[j] - a[j]) * u);
      return out;
    }
  }
  return K[n - 1].slice(1);
}

/* ---------- transformación y rectángulos alineados al pixel ---------- */
const T = { s: 1, ox: 0, oy: 0 };
function cam(x, y, z) { T.s = S * z; T.ox = cvs.width / 2 - x * T.s; T.oy = cvs.height / 2 - y * T.s; }
function screenSpace() { T.s = S; T.ox = 0; T.oy = 0; }
function R(x, y, w, h, c) {
  const x0 = Math.round(T.ox + x * T.s), y0 = Math.round(T.oy + y * T.s);
  const x1 = Math.round(T.ox + (x + w) * T.s), y1 = Math.round(T.oy + (y + h) * T.s);
  if (x1 <= x0 || y1 <= y0) return;
  ctx.fillStyle = c;
  ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
}
function devPt(x, y) { return [T.ox + x * T.s, T.oy + y * T.s]; }
function clipRect(x, y, w, h) {
  const x0 = Math.round(T.ox + x * T.s), y0 = Math.round(T.oy + y * T.s);
  const x1 = Math.round(T.ox + (x + w) * T.s), y1 = Math.round(T.oy + (y + h) * T.s);
  ctx.beginPath(); ctx.rect(x0, y0, Math.max(0, x1 - x0), Math.max(0, y1 - y0)); ctx.clip();
}

/* grilla de pixel art: origen, tamaño de pixel y espejo */
const GR = { x: 0, y: 0, p: 1, f: 1 };
function grid(x, y, p, f = 1) { GR.x = x; GR.y = y; GR.p = p; GR.f = f; }
function g(px, py, w, h, c) {
  const p = GR.p;
  if (GR.f > 0) R(GR.x + px * p, GR.y + py * p, w * p, h * p, c);
  else R(GR.x - (px + w) * p, GR.y + py * p, w * p, h * p, c);
}
function bmp(rows, px, py, pal, k = 1) {
  for (let j = 0; j < rows.length; j++) {
    const r = rows[j]; let i = 0;
    while (i < r.length) {
      const ch = r[i];
      if (ch === '.' || !pal[ch]) { i++; continue; }
      let e = i + 1; while (e < r.length && r[e] === ch) e++;
      g(px + i * k, py + j * k, (e - i) * k, k, pal[ch]);
      i = e;
    }
  }
}
function pcirc(cx, cy, r, c) {
  for (let j = Math.floor(cy - r); j < Math.ceil(cy + r); j++) {
    const dy = j + 0.5 - cy, hw = Math.sqrt(Math.max(0, r * r - dy * dy));
    const a = Math.round(cx - hw), b = Math.round(cx + hw);
    if (b > a) g(a, j, b - a, 1, c);
  }
}
function box(x, y, w, h, fill, border) {
  g(x + 1, y, w - 2, 1, border); g(x + 1, y + h - 1, w - 2, 1, border);
  g(x, y + 1, 1, h - 2, border); g(x + w - 1, y + 1, 1, h - 2, border);
  g(x + 1, y + 1, w - 2, h - 2, fill);
}

/* ---------- fuente pixel 3x5 (para lo que sale dentro de las pantallas) ---------- */
const FONT = {
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',
  F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',
  K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',
  P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
  U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',
  Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
  '4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111',
  '9':'111101111001110','%':'101001010100101','$':'011100010001110','-':'000000111000000','.':'000000000000010',
  '/':'001001010100100','!':'010010010000010','?':'110001010000010',':':'000010000010000',' ':'000000000000000'
};
const ACC = { 'Ó': ['O', 1], 'Í': ['I', 1], 'Á': ['A', 1], 'É': ['E', 1], 'Ú': ['U', 1], 'Ñ': ['N', 2] };
function ptext(s, x, y, c, k = 1) {
  let cx = x;
  for (const ch0 of s) {
    let ch = ch0, acc = 0;
    if (ACC[ch]) { acc = ACC[ch][1]; ch = ACC[ch][0]; }
    const gl = FONT[ch];
    if (gl) {
      for (let j = 0; j < 5; j++) {
        let i = 0;
        while (i < 3) {
          if (gl[j * 3 + i] === '1') {
            let e = i + 1; while (e < 3 && gl[j * 3 + e] === '1') e++;
            g(cx + i * k, y + j * k, (e - i) * k, k, c); i = e;
          } else i++;
        }
      }
      if (ch0 === '$') { g(cx + k, y - k, k, k, c); g(cx + k, y + 5 * k, k, k, c); }
      if (acc === 1) g(cx + 2 * k, y - k, k, k, c);
      else if (acc === 2) g(cx, y - k, 3 * k, k, c);
    }
    cx += 4 * k;
  }
}
const ptw = (s, k = 1) => s.length * 4 * k - k;

/* ---------- paleta ---------- */
const C = {
  skin: '#f7c59f', skinS: '#e3a57c', lid: '#d9936a', hair: '#4a2c1c', brow: '#2a1810',
  hat: '#c98a46', hatS: '#9c6630', hatH: '#e2ab69', band: '#4a2a17',
  shirt: '#8f5bff', shirtS: '#6c3fe0', shirtH: '#a985ff', belt: '#4b2aa0',
  pants: '#3a52b4', pantsS: '#2a3d8c', shoe: '#eef1ff', sole: '#9aa3c9',
  eye: '#141225', glint: '#ffffff', mouth: '#4a1626', teeth: '#ffffff', tongue: '#ff6b81',
  blush: '#ff8fa6', sweat: '#8fd8ff'
};
const RED = '#ff4d5e', GRN = '#33e08a', YEL = '#ffcf3f', WHT = '#ffffff';

/* fechas reales: la oferta buena dice la fecha de hoy */
const NOW = new Date();
const TODAY = String(NOW.getDate()).padStart(2, '0') + '/' + String(NOW.getMonth() + 1).padStart(2, '0');
const EXPIRED = 'VENCIÓ ' + String(NOW.getMonth() + 1).padStart(2, '0') + '/' + String((NOW.getFullYear() - 1) % 100).padStart(2, '0');

/* =====================================================================
   PERSONAJE (front y perfil). Origen en los pies, y hacia arriba negativa.
   ===================================================================== */
const EX = {
  neutral:      { bL: [0, 0, 0],   bR: [0, 0, 0],   eL: 'dot',   eR: 'dot',   m: 'flat' },
  suspicious:   { bL: [-1, -1, -1], bR: [1, 1, 0],  eL: 'dot',   eR: 'half',  m: 'side' },
  suspLupa:     { bL: [1, 1, 0],   bR: [-1, -1, -1], eL: 'half', eR: 'big',   m: 'side' },
  uneasy1:      { bL: [0, 0, -1],  bR: [-1, 0, 0],  eL: 'dot',   eR: 'dot',   m: 'flat' },
  uneasy2:      { bL: [1, 0, -1],  bR: [-1, 0, 1],  eL: 'dot',   eR: 'dot',   m: 'wavy', sweat: 1 },
  uneasy3:      { bL: [1, 0, -1],  bR: [-1, 0, 1],  eL: 'dot',   eR: 'dot',   m: 'grimace', sweat: 1 },
  disappointed: { bL: [1, 0, -1],  bR: [-1, 0, 1],  eL: 'half',  eR: 'half',  m: 'frown' },
  curious:      { bL: [-1, -1, 0], bR: [0, -1, -1], eL: 'big',   eR: 'big',   m: 'o' },
  interested:   { bL: [-1, -1, -1], bR: [-1, -1, -1], eL: 'dot', eR: 'dot',   m: 'smallsmile' },
  wow:          { bL: [-1, -1, -1], bR: [-1, -1, -1], eL: 'big', eR: 'big',   m: 'wow', blush: 1 },
  smile:        { bL: [0, -1, 0],  bR: [0, -1, 0],  eL: 'dot',   eR: 'dot',   m: 'smile', blush: 1 },
  grin:         { bL: [-1, -1, -1], bR: [-1, -1, -1], eL: 'happy', eR: 'happy', m: 'grin', blush: 1 },
  determined:   { bL: [-1, 0, 1],  bR: [1, 0, -1],  eL: 'dot',   eR: 'dot',   m: 'smirk' },
  meh:          { bL: [0, 0, 0],   bR: [0, 0, 0],   eL: 'half',  eR: 'half',  m: 'flat' }
};
const MO = {
  flat:       ['......', '.####.', '......'],
  side:       ['......', '..####', '......'],
  wavy:       ['......', '.##..#', '#..##.'],
  grimace:    ['######', '#wwww#', '######'],
  frown:      ['......', '..##..', '.#..#.'],
  o:          ['......', '..##..', '..##..'],
  smallsmile: ['......', '.#..#.', '..##..'],
  wow:        ['..##..', '.#rr#.', '..##..'],
  smile:      ['......', '#....#', '.####.'],
  grin:       ['######', '#wwww#', '.####.'],
  smirk:      ['......', '.....#', '.####.']
};
const MC = { '#': C.mouth, w: C.teeth, r: C.tongue };
const isBlink = t => ((t + 0.4) % 3.6) < 0.11;

function eye(type, x) {
  switch (type) {
    case 'dot':    g(x, -16, 2, 2, C.eye); g(x, -16, 1, 1, C.glint); break;
    case 'big':    g(x, -17, 2, 3, C.eye); g(x, -17, 1, 1, C.glint); break;
    case 'half':   g(x, -16, 2, 1, C.lid); g(x, -15, 2, 1, C.eye); break;
    case 'closed': g(x, -15, 2, 1, C.eye); break;
    case 'happy':  g(x - 1, -15, 1, 1, C.eye); g(x, -16, 2, 1, C.eye); g(x + 2, -15, 1, 1, C.eye); break;
  }
}
function brow(o, x) { for (let i = 0; i < 3; i++) g(x + i, -18 + o[i], 1, 1, C.brow); }

function face(st) {
  const e = EX[st.expr] || EX.neutral;
  const sh = Math.max(-1, Math.min(1, Math.round(st.look || 0)));
  const bl = isBlink(st.t);
  const eL = bl && e.eL !== 'happy' ? 'closed' : e.eL;
  const eR = bl && e.eR !== 'happy' ? 'closed' : e.eR;
  brow(e.bL, -5 + sh); brow(e.bR, 2 + sh);
  eye(eL, -4 + sh); eye(eR, 2 + sh);
  bmp(MO[e.m] || MO.flat, -3 + sh, -14, MC);
  if (e.blush) { g(-6, -13, 2, 1, C.blush); g(4, -13, 2, 1, C.blush); }
  if (e.sweat) { const k = (st.t * 1.6) % 1; g(6, -19 + Math.floor(k * 3), 1, 2, C.sweat); }
}

function charShadow(st) {
  const k = clamp(1 - st.hop / 40, 0.4, 1);
  grid(st.ox, G, P);
  ctx.globalAlpha = 0.42 * k;
  g(-6, 0, 12, 1, '#000'); g(-4, 1, 8, 1, '#000');
  ctx.globalAlpha = 1;
}

function charFront(st) {
  grid(st.ox, G - st.hop, P);
  // piernas y zapatos
  g(-4, -5, 3, 3, C.pants); g(1, -5, 3, 3, C.pants);
  g(-2, -5, 1, 3, C.pantsS); g(3, -5, 1, 3, C.pantsS);
  g(-5, -2, 4, 1, C.shoe); g(1, -2, 4, 1, C.shoe);
  g(-5, -1, 4, 1, C.sole); g(1, -1, 4, 1, C.sole);
  // torso
  g(-5, -10, 10, 5, C.shirt); g(-5, -10, 1, 4, C.shirtH); g(4, -10, 1, 5, C.shirtS);
  g(-1, -10, 2, 1, C.skin);
  g(-5, -6, 10, 1, C.belt); g(-1, -6, 2, 1, YEL);
  // cabeza
  g(-6, -20, 12, 10, C.skin); g(-6, -11, 12, 1, C.skinS);
  g(-7, -16, 1, 2, C.skinS); g(6, -16, 1, 2, C.skinS);
  g(-6, -20, 1, 3, C.hair); g(5, -20, 1, 3, C.hair);
  // sombrero de detective
  g(-5, -24, 10, 3, C.hat); g(-4, -24, 3, 1, C.hatH);
  g(-5, -22, 10, 1, C.band); g(-7, -21, 14, 1, C.hatS);
  face(st);
}

function armLine(x0, y0, x1, y1, c) {
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let n = 0; n < 64; n++) {
    g(x0, y0, 2, 2, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function toGrid(st, w) { return [Math.round((w.x - st.ox) / P - 1), Math.round((w.y - (G - st.hop)) / P - 1)]; }
function relW(st, rx, ry) { return { x: st.ox + rx, y: G - st.hop + ry }; }

function armsFront(st) {
  grid(st.ox, G - st.hop, P);
  const L = st.handL ? toGrid(st, st.handL) : [-7, -6];
  const Rr = st.handR ? toGrid(st, st.handR) : [5, -6];
  grid(st.ox, G - st.hop, P);
  armLine(-7, -10, L[0], L[1], C.shirtS); g(L[0], L[1], 2, 2, C.skin);
  armLine(5, -10, Rr[0], Rr[1], C.shirtS); g(Rr[0], Rr[1], 2, 2, C.skin);
  if (st.thumbR) { g(Rr[0], Rr[1] - 2, 1, 2, C.skin); g(Rr[0] + 1, Rr[1], 1, 2, C.skinS); }
  if (st.thumbL) { g(L[0] + 1, L[1] - 2, 1, 2, C.skin); g(L[0], L[1], 1, 2, C.skinS); }
}

/* perfil mirando a la derecha; f = -1 lo espeja hacia la izquierda */
function charSide(st) {
  const f = st.face, a = Math.sin(st.walk), dx = Math.round(a * 2);

/* =====================================================================
   LUPA (con aumento real de lo que hay detrás)
   ===================================================================== */
const LR = 8.6, LP = 3, HANDLE = 8;
const RING = [], GLASS = [];
for (let j = -9; j < 9; j++) {
  let mn = 99, mx = -99;
  for (let i = -9; i < 9; i++) {
    const d = Math.hypot(i + 0.5, j + 0.5);
    if (d < LR) {
      if (d >= LR - 1.05) RING.push([i, j, 0]);
      else if (d >= LR - 2.1) RING.push([i, j, 1]);
      else { mn = Math.min(mn, i); mx = Math.max(mx, i); }
    }
  }
  if (mx >= mn) GLASS.push([j, mn, mx + 1]);
}
const LUPA_REACH = (LR + HANDLE) * LP;

function lensClip(L) {
  ctx.beginPath();
  for (const [j, a, b] of GLASS) {
    const x0 = Math.round(T.ox + (L.x + a * LP) * T.s), x1 = Math.round(T.ox + (L.x + b * LP) * T.s);
    const y0 = Math.round(T.oy + (L.y + j * LP) * T.s), y1 = Math.round(T.oy + (L.y + (j + 1) * LP) * T.s);
    ctx.rect(x0, y0, x1 - x0, y1 - y0);
  }
  ctx.clip();
}
function drawLupa(L, dir, magFn) {
  if (magFn) {
    ctx.save();
    lensClip(L);
    const s0 = T.s, ox0 = T.ox, oy0 = T.oy, m = 1.8;
    T.ox = ox0 + L.x * s0 * (1 - m); T.oy = oy0 + L.y * s0 * (1 - m); T.s = s0 * m;
    R(L.x - 40, L.y - 40, 80, 80, BGC);
    magFn();
    T.s = s0; T.ox = ox0; T.oy = oy0;
    ctx.restore();
  }
  grid(L.x, L.y, LP);
  ctx.globalAlpha = 0.14;
  for (const [j, a, b] of GLASS) g(a, j, b - a, 1, '#bfe9ff');
  ctx.globalAlpha = 0.85;
  g(-5, -6, 2, 1, WHT); g(-6, -5, 1, 2, WHT); g(-3, -6, 1, 1, WHT);
  ctx.globalAlpha = 1;
  // mango
  for (let k = HANDLE; k >= 0; k--) {
    const q = LR + k - 0.2;
    const hx = Math.round(dir.x * q - 1), hy = Math.round(dir.y * q - 1);
    g(hx, hy, 2, 2, k < 2 ? '#f0b13a' : '#7a4520');
  }
  // aro
  for (const [i, j, k] of RING) g(i, j, 1, 1, k === 0 ? '#c9861a' : '#ffd75e');
  return { x: L.x + dir.x * LUPA_REACH, y: L.y + dir.y * LUPA_REACH };
}

function drawScreen(ph, sx, sy, p) {
  const w = 60 * p, h = 74 * p;
  if (ph.s < 0.3) {
    R(sx, sy, w, h, '#9fe0ff'); R(sx, sy, w, h * 0.16, '#ffffff');
    R(sx + w * 0.12, sy + h * 0.28, w * 0.76, h * 0.18, '#ffd36b');
    R(sx + w * 0.12, sy + h * 0.58, w * 0.5, h * 0.1, '#5b6fd6');
    return;
  }
  R(sx, sy, w, h, '#070a1e');
  const pw = ph.power;
  if (ph.dead || pw <= 0) {
    R(sx + w * 0.62, sy + h * 0.06, w * 0.08, h * 0.3, '#11163a');
    R(sx + w * 0.74, sy + h * 0.06, w * 0.04, h * 0.3, '#11163a');
    return;
  }
  let ch = h;
  if (pw < 1) {
    const a = seg(pw, 0, 0.35), b = seg(pw, 0.35, 1);
    if (b <= 0) { const lw = Math.max(p, w * eo(a)); R(sx + (w - lw) / 2, sy + h / 2 - p, lw, 2 * p, '#e8fbff'); return; }
    ch = Math.max(2 * p, h * eo(b));
  }
  ctx.save();
  clipRect(sx, sy + (h - ch) / 2, w, ch);
  grid(sx, sy, p, 1);
  if (ph.kind === 'good') siteGood(ph.st); else siteBad(ph.st);
  if (ph.dim) { ctx.globalAlpha *= ph.dim; R(sx, sy, w, h, '#151827'); }
  if (pw < 1) { ctx.globalAlpha = (ph.alpha == null ? 1 : ph.alpha) * (1 - seg(pw, 0.35, 1)) * 0.85; R(sx, sy, w, h, '#e8fbff'); }
  ctx.restore();
}

}

}
function wipe(t) {
  let c = 0;
  if (t > 18.7 && t < 19.3) c = 1 - Math.abs(t - 19) / 0.3;
  else if (t > 29.6) c = (t - 29.6) / 0.4;
  else if (t < 0.4) c = 1 - t / 0.4;
  if (c <= 0) return;
  c = eio(clamp(c));
  screenSpace();
  const cs = 30, cols = 12, rows = 22, tot = cols + rows * 0.55;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const o = (i + j * 0.55) / tot, l = clamp(c * 1.6 - o * 0.6);
    if (l <= 0) continue;
    if (l >= 1) { R(i * cs, j * cs, cs, cs, '#0a0e24'); continue; }
    if (l >= 0.88) { R(i * cs, j * cs, cs, cs, '#0a0e24'); continue; }
    const s = cs * l * 1.12;
    R(i * cs + (cs - s) / 2, j * cs + (cs - s) / 2, s, s, '#0a0e24');
  }
}

/* =====================================================================
   CUADRO COMPLETO
   ===================================================================== */
function render(t) {
  let [cx, cy, cz] = kf(t, CAM);
  if (t > 10.45 && t < 11.9) cx = kf(t, CHX)[0] + (WCX - CHAR_A);
  // pequeño golpe de cámara al aparecer cada señal
  for (const ic of ICONS) {
    const d = t - ic.t;
    if (d > 0 && d < 0.25) { const k = (1 - d / 0.25) * (ic.type === 'q' ? 1.6 : 0.8); cx += Math.sin(d * 90) * k; cy += Math.cos(d * 70) * k * 0.6; }
  }
  drawBG(t, cx, cy, cz);
  cam(cx, cy, cz);
  drawFloor(cx, cy, cz);
  if (t < 19) renderA(t); else renderB(t);
  speedLines(t);
  if (t >= 19.4 && t < 26.6) drawConfetti(t, 19.4, 44, 25.6);
  if (t >= 26.5) drawConfetti(t, 26.5, 22, 29.2);
  overlays(t);
  drawTexts(t);
  wipe(t);
}

/* =====================================================================
   REPRODUCCIÓN, CONTROLES Y TAMAÑO
   ===================================================================== */
let t = 0, playing = true, ready = false, dirty = true, last = null;
const segs = [...document.querySelectorAll('.seg')];
const fills = segs.map(s => s.querySelector('.fill'));
const btnPlay = document.getElementById('play');
const btnRestart = document.getElementById('restart');
const bigPlay = document.getElementById('bigPlay');
const iPause = btnPlay.querySelector('.i-pause'), iPlay = btnPlay.querySelector('.i-play');
const lastFill = fills.map(() => -1);

function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; bgGrad = null; }
  S = cvs.width / W;
  dirty = true;
}
function setPlaying(v) {
  playing = v;
  iPause.style.display = v ? '' : 'none';
  iPlay.style.display = v ? 'none' : '';
  btnPlay.setAttribute('aria-label', v ? 'Pausar' : 'Reproducir');
  bigPlay.hidden = v;
  last = null;
}
function seek(v) { t = ((v % DUR) + DUR) % DUR; dirty = true; }
function sceneIndex(v) { for (let i = SCENES.length - 1; i >= 0; i--) if (v >= SCENES[i][0]) return i; return 0; }
function updateHUD() {
  for (let i = 0; i < SCENES.length; i++) {
    const f = clamp((t - SCENES[i][0]) / (SCENES[i][1] - SCENES[i][0]));
    if (Math.abs(f - lastFill[i]) > 0.002) { fills[i].style.transform = 'scaleX(' + f.toFixed(4) + ')'; lastFill[i] = f; }
  }
}

segs.forEach((b, i) => b.addEventListener('click', () => seek(SCENES[i][0] + 0.0001)));
btnPlay.addEventListener('click', () => setPlaying(!playing));
bigPlay.addEventListener('click', () => setPlaying(true));
btnRestart.addEventListener('click', () => { seek(0); setPlaying(true); });
cvs.addEventListener('click', () => setPlaying(!playing));
window.addEventListener('keydown', e => {
  const onButton = e.target && e.target.tagName === 'BUTTON';
  if ((e.key === ' ' || e.key === 'Enter') && onButton) return;
  if (e.key === ' ' || e.key === 'k' || e.key === 'K') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'r' || e.key === 'R') { seek(0); setPlaying(true); }
  else if (e.key === 'ArrowRight') { const i = sceneIndex(t); seek(SCENES[(i + 1) % SCENES.length][0] + 0.0001); }
  else if (e.key === 'ArrowLeft') { const i = sceneIndex(t); const back = t - SCENES[i][0] < 0.6 ? (i + SCENES.length - 1) % SCENES.length : i; seek(SCENES[back][0] + 0.0001); }
});
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { last = null; });

function frame(now) {
  if (last === null) last = now;
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now;
  if (playing && ready) { t = (t + dt) % DUR; dirty = true; }
  if (dirty) { render(t); updateHUD(); dirty = false; }
  requestAnimationFrame(frame);
}

resize();
const fontsReady = (document.fonts && document.fonts.load)
  ? Promise.all([document.fonts.load('40px "Lilita One"'), document.fonts.load('700 16px "Space Mono"')]).catch(() => null)
  : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(() => { ready = true; last = null; dirty = true; });
requestAnimationFrame(frame);

// gancho para revisar cuadros sueltos (no es parte de la interfaz)
window.__senales = { seek: v => { seek(v); render(t); updateHUD(); }, pause: () => setPlaying(false), get t() { return t; } };
})();
</script>
